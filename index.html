function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function star(n){ var s=''; for(var i=0;i<n;i++){ s+='★'; } for(var i=n;i<5;i++){ s+='☆'; } return s; }
function city(id){ for(var i=0;i<CITIES.length;i++){ if(CITIES[i].id===id) return CITIES[i]; } return null; }
function nm(id){ var c=city(id); return c ? c.name : id; }
function rtTxt(id){ var m=RT[id]; return m===0 ? '在家门口' : '往返约 ' + (Math.round(m/6)/10) + ' 小时'; }

function renderList(){
  var h='';
  for(var i=0;i<CITIES.length;i++){
    var c=CITIES[i];
    var on = picked.indexOf(c.id)>=0;
    h += '<section class="city'+(on?' picked':'')+'" id="city-'+c.id+'">';
    h += '<div class="c-head" onclick="toggle('+"'"+c.id+"'"+')">';
    h += '<div class="c-emoji">'+c.emoji+'</div>';
    h += '<div class="c-title"><h3>'+c.name+'</h3><div class="sub">'+esc(c.sub)+'</div><div class="sub" style="font-size:11px;margin-top:3px;color:#7a5216">🚄 '+esc(c.time)+' · 💰 '+esc(c.price)+' · '+rtTxt(c.id)+'</div></div>';
    h += '<div style="text-align:right"><div class="stars">'+star(c.stars)+'</div><div class="sub" style="font-size:11px;color:#8a8172">'+esc(c.tag)+'</div></div>';
    h += '<div class="check">'+(on?'✓':'')+'</div></div>';
    h += '<div class="c-body">';
    h += '<div class="row">';
    h += '<span class="badge strong">🚄 '+esc(c.time)+'</span>';
    h += '<span class="badge strong">💰 '+esc(c.price)+'</span>';
    h += '<span class="badge">'+rtTxt(c.id)+'</span>';
    if(c.warn){ h += '<span class="badge warn">'+esc(c.warn)+'</span>'; }
    h += '</div>';
    h += '<h4>🎡 景点</h4><ul>';
    for(var j=0;j<c.spots.length;j++){ var sp=c.spots[j]; h += '<li><span class="n">'+sp[0]+'</span> <span class="a">· '+esc(sp[1])+'</span>'+(sp[2]?' <span class="t">('+esc(sp[2])+')</span>':'')+'</li>'; }
    h += '</ul>';
    h += '<h4>🍡 糯叽叽 / 美食</h4><ul>';
    for(var k=0;k<c.foods.length;k++){ var f=c.foods[k]; h += '<li><span class="n">'+f[0]+'</span>'+(f[1]?' <span class="a">'+esc(f[1])+'</span>':'')+(f[2]?' <span class="t">— '+esc(f[2])+'</span>':'')+'</li>'; }
    h += '</ul>';
    if(c.booking){ h += '<div class="note">🎫 预约：'+esc(c.booking)+'</div>'; }
    if(c.tips){ h += '<div class="note">💡 '+esc(c.tips)+'</div>'; }
    h += '</div></section>';
  }
  document.getElementById('list').innerHTML = h;
}

function toggle(id){
  var i = picked.indexOf(id);
  if(i>=0){ picked.splice(i,1); } else { picked.push(id); }
  try{ localStorage.setItem('tripPicked', JSON.stringify(picked)); }catch(e){}
  refresh();
}

function renderBar(){
  var el = document.getElementById('selList');
  if(picked.length===0){ el.innerHTML='<span class="empty">还没选，点下面卡片试试 →</span>'; }
  else{
    var h='';
    for(var i=0;i<picked.length;i++){ var c=city(picked[i]); h += '<span class="sel-pill" onclick="toggle('+"'"+picked[i]+"'"+')">'+c.emoji+' '+c.name+' <small>'+esc(c.time)+'</small> ×</span>'; }
    el.innerHTML=h;
  }
  var sum='';
  if(picked.length){
    var tot=0, nonhz=0;
    for(var j=0;j<picked.length;j++){ tot += RT[picked[j]]; if(picked[j]!=='hz') nonhz++; }
    sum = '已选 '+picked.length+' 个 · 其中 '+nonhz+' 个外地城市';
    sum += ' · 平均单日通勤约 '+(Math.round((tot/nonhz)/6)/10 || 0)+' 小时（往返）';
    if(nonhz>5){ sum += ' · ⚠️ 城市有点多，7天会排不下'; }
  }
  document.getElementById('summary').innerHTML = sum;
  document.getElementById('plan').innerHTML = '';
}

function genPlan(){
  var days=['10/1 周四','10/2 周五','10/3 周六','10/4 周日','10/5 周一','10/6 周二','10/7 周三'];
  var pool = picked.filter(function(id){ return id!=='hz'; });
  var ordered = pool.slice().sort(function(a,b){ return ORDER.indexOf(a)-ORDER.indexOf(b); });
  var lines=[];
  lines.push('<b>🗓️ 我的7天（每天回杭州）</b>');
  lines.push('10/1 周四：杭州本地（良渚/西湖西线，避开最难抢的高铁票）');
  var i=0;
  for(var d=1; d<6 && i<ordered.length; d++){
    lines.push(days[d]+'：'+nm(ordered[i])+'（当天往返，'+esc(city(ordered[i]).time)+'）');
    i++;
  }
  lines.push('10/7 周三：杭州本地休整（灵隐/满觉陇/塘栖，避开返程高峰）');
  var rest=ordered.slice(i);
  if(rest.length){ lines.push('⚠️ 还有 '+rest.map(nm).join('、')+' 没排进7天：可替换上面某天，或留到周末去。'); }
  if(pool.length===0){ lines.push('还没选城市，先点下面卡片。'); }
  document.getElementById('plan').innerHTML = lines.join('<br>');
}

function refresh(){
  renderList();
  renderBar();
  var secs=document.querySelectorAll('section.city');
  for(var i=0;i<secs.length;i++){
    if(secs[i].classList.contains('picked')){ secs[i].classList.add('open'); }
  }
}
document.getElementById('btnPlan').onclick=genPlan;
document.getElementById('btnClear').onclick=function(){ picked=[]; try{ localStorage.removeItem('tripPicked'); }catch(e){} refresh(); };
document.getElementById('btnAll').onclick=function(){ picked=CITIES.map(function(c){ return c.id; }); try{ localStorage.setItem('tripPicked', JSON.stringify(picked)); }catch(e){} refresh(); };
refresh();

function copyText(){
  var out = '🎒 国庆7天 · 杭州当天往返（学生党版）\n';
  var any = false;
  for(var i=0;i<picked.length;i++){
    var c = city(picked[i]);
    out += '\n' + c.emoji + ' ' + c.name + ' ｜ 车程 ' + c.time + ' ｜ ' + c.price + ' ｜ ' + rtTxt(c.id) + '\n';
    out += '  景点：';
    for(var j=0;j<c.spots.length;j++){ out += (j?', ':'') + c.spots[j][0]; }
    out += '\n  吃：';
    for(var k=0;k<c.foods.length;k++){ out += (k?', ':'') + c.foods[k][0]; }
    if(c.warn){ out += '\n  ⚠️ ' + c.warn; }
    out += '\n';
    any = true;
  }
  if(!any){ out += '\n还没选城市。'; }
  function done(ok){ var tip=document.createElement('div'); tip.style.cssText='margin-top:8px;font-size:13px;color:'+(ok?'#2f6f5e':'#9a3a22'); tip.textContent= ok ? '已复制，去微信/备忘录粘贴即可' : '复制失败，可长按选择下方文字手动复制'; document.getElementById('plan').appendChild(tip); setTimeout(function(){ tip.remove(); }, 3000); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(out).then(function(){ done(true); }, function(){ fallback(); }); } else { fallback(); }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=out; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(true); }catch(e){ done(false); document.getElementById('plan').innerHTML += '<div style="margin-top:8px;font-size:13px;white-space:pre-wrap">'+esc(out)+'</div>'; }
    document.body.removeChild(ta);
  }
}
document.getElementById('btnCopy').onclick=copyText;
</script>
</body>
